name: Release

on:
  push:
    branches: [main]
    paths: [Info.plist]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: ./build.sh

      - name: Verify universal binary
        if: steps.check.outputs.skip != 'true'
        run: |
          lipo "AI Radio.app/Contents/MacOS/AIRadio" -verify_arch arm64 x86_64
          codesign --verify "AI Radio.app"

      - name: Package
        if: steps.check.outputs.skip != 'true'
        run: ditto -c -k --keepParent "AI Radio.app" AIRadio.zip

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" AIRadio.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest
